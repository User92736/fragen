<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loui Schreiben</title>
    <link rel="icon" href="https://i.ibb.co/4wHYGtPD/Profilbild.png">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            color: black;
            font-family: 'Open Sans', sans-serif;
        }
        body {
            background-color: rgb(250, 246, 240);
        }
        ::placeholder {
            color: gray;
        }
        header {
            font-size: 3vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 5vh;
            background-color: rgb(230, 226, 220);
        }
        form, div {
            width: 20vw;
            margin: 10vh auto 0;
            display: flex;
            flex-direction: column;
            gap: 5vh;
            align-items: center;
        }
        input, select {
            width: 50%;
            padding: 2%;
            font-size: 100%;
            box-sizing: border-box;
        }
        textarea {
            resize: none;
            height: 40vh;
            width: 200%;
            font-size: 2vh;
        }
        button {
            background-color: red;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 50%;
            padding: 2%;
            font-size: 100%;
        }
        #btnAnmelden {
            width: 35%;
        }
        @media (max-width: 1800px) {
            form, div {
                width: 100%;
            }
            textarea {
                width: 70%;
            }
            input, select, button {
                height: 5vh;
                padding: 1px;
                width: 25%;
            }
            #btnAnmelden {
                width: 15%;
            }
        }
        @media (max-height: 720px) {
            form, div {
                gap: 3vh;
            }
            input, select, button {
                padding: 0 1px 1px 1px;
            }
            textarea {
                font-size: 3vh;
            }
        }
        @media (max-width: 800px) {
            textarea {
                width: 90%;
            }
            input, select, button {
                width: 50%;
            }
            #btnAnmelden {
                width: 40%;
            }
        }
    </style>
</head>
<body>
    <header>Schreibe Loui deine Frage</header>
    <form id="form">
        <input type="hidden" name="access_key" value="ff79b1ea-f68b-4177-b28d-7c721cc324f6">
        <input type="text" id="name" name="name" placeholder="Dein Name" required>
        <input type="email" id="email" name="email" placeholder="Deine E-Mail Adresse" required>
        <select name="subject" required>
            <option value="" disabled selected hidden>Thema wählen</option>
            <option value="E-Mail von deiner Webseite: Thema &quot;Minecraft&quot;">Minecraft</option>
            <option value="E-Mail von deiner Webseite: Thema &quot;etwas Programmieren&quot;">Etwas Programmieren</option>
            <option value="E-Mail von deiner Webseite: Thema &quot;anderes&quot;">Anderes</option>
        </select>
        <input type="hidden" name="code" id="code">
        <textarea name="message" placeholder="Deine Nachricht" required></textarea>
        <input name="zurueckschreiben" type="hidden" value="https://supabase.com/dashboard/project/uwhijhrlnfgrgjcrdxzj/editor/17648?schema=public">
        <button type="submit" id="btnSend"><b>Abschicken</b></button>
    </form>
    <div class="anmelden" style="margin: 3vh auto 0;">
        <button id="btnAnmelden" style="background-color: rgb(0, 171, 255);" onclick="window.location.href='anmelden/index.html'"><b>Anmelden</b></button>
    </div>
    <script>
        const supabaseUrl = 'https://uwhijhrlnfgrgjcrdxzj.supabase.co'
        const supabaseKey = 'sb_publishable_GB9zaLpCO733A51n_g8Y5w_QgTRKkTZ'
        const tabellenName = 'Antworten'
        const db = supabase.createClient(supabaseUrl, supabaseKey);
        function CodeGenerieren() {return Math.random().toString(36).substring(2, 8).toUpperCase();};
        let code = '';
        async function CodeErneuern() {
            let CodeExistiert = true;
            while (CodeExistiert) {
                code = CodeGenerieren();
                const {data, error} = await db
                    .from(tabellenName)
                    .select('data')
                    .ilike('data', '%' + code + '%')
                    .limit(1)
                if (error) {
                    alert("Fehler beim Senden der Nachricht.");
                    location.reload();
                    return false;
                }
                if (data.length === 0) {
                    CodeExistiert = false;
                }
            }
            return true;
        }
        async function codeInTabelleHinzufügen() {
            const {error} = await db
                .from(tabellenName)
                .insert({
                    data: document.getElementById("name").value + "," + document.getElementById("email").value + "," + code,
                    content: ""
                })
            if (error) {
                alert("Fehler beim Senden der Nachricht.");
                location.reload();
                return false;
            }
            return true;
        }
        document.getElementById('form').onsubmit = async (abschicken) => {
            abschicken.preventDefault();
            const CodeOK = await CodeErneuern();
            if(!CodeOK) return
            document.getElementById("code").value = code;
            const gespeichertOK = await codeInTabelleHinzufügen();
            if (!gespeichertOK) return
            const response = await fetch('https://api.web3forms.com/submit', {method: 'POST', body: new FormData(abschicken.target)});
            if (response.ok) {
                alert("Die Nachricht wurde Gesendet! "+"Dein Code: " + code);
                abschicken.target.reset();
            } else {
                alert("Fehler beim Senden der Nachricht.");
                location.reload();
            }
        }
    </script>
</body>
</html>
